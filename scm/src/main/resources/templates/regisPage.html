<!DOCTYPE html>
<html lang="en" th:replace="~{base :: parent(~{::#content},~{::title},~{::script})}">

<head>
    <title>Register page</title>
</head>

<body class="bg-gray-100 dark:bg-gray-900 transition-colors duration-300">

    <div id="content" th:fragment="content" class="min-h-screen flex items-center justify-center px-4">
        <div class="w-full sm:max-w-md md:max-w-lg lg:max-w-xl bg-blue-500 rounded-lg shadow-md ">

            <!-- Logo -->
            <div class="flex justify-center mt-4">
                <img th:src="@{/images/wel.jpeg}" class="h-20 w-20 rounded-full shadow-md" alt="Logo" />
            </div>

            <!-- Card -->
            <div class="p-8 bg-white text-gray-900 rounded-t-2xl shadow-inner rounded-lg  
                        dark:bg-gray-800 dark:text-gray-100 dark:shadow-gray-700 mt-4">

                <!-- Message fragment -->
                <div data-th-replace="message::messagebox"></div>

                <h5 class="mb-4 text-3xl font-bold text-center text-gray-900 dark:text-white">
                    Register Account
                </h5>

                <!-- Registration Form -->
                <form th:action="@{/do-register}" method="post" th:object="${user}" class="px-5">

                    <!-- Full Name -->
                    <div class="mb-3">
                        <label class="block mb-1 text-sm font-medium text-gray-700 dark:text-gray-300">Full Name</label>
                        <input type="text" th:field="*{name}"
                            class="w-full p-2 border  rounded-md dark:bg-gray-700 dark:text-white"
                            placeholder="Enter your name" />
                        <!-- Validation Error Display -->
                        <p th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="text-red-600 text-sm mt-1">
                        </p>
                    </div>

                    <!-- Email -->
                    <div class="mb-3">
                        <label>Email</label>
                        <input type="email" th:field="*{email}" class="w-full p-2 border rounded-md"
                            placeholder="Enter your email" />
                        <p th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="text-red-600 text-sm mt-1">
                        </p>
                    </div>


                    <!-- Password -->
                    <div class="mb-3">
                        <label>Password</label>
                        <input type="password" th:field="*{password}" class="w-full p-2 border rounded-md"
                            placeholder="Enter password" />
                        <p th:if="${#fields.hasErrors('password')}" th:errors="*{password}"
                            class="text-red-600 text-sm mt-1"></p>
                    </div>



                    <!-- Phone -->
                    <div class="mb-3">
                        <label>Phone</label>
                        <input type="text" th:field="*{phoneNumber}" class="w-full p-2 border rounded-md" placeholder="Enter Phone Number" />
                        <p th:if="${#fields.hasErrors('phoneNumber')}" th:errors="*{phoneNumber}"
                            class="text-red-600 text-sm mt-1"></p>
                    </div>
                   
                    <!-- About -->
                    <div class="mb-3">
                        <label>About</label>
                        <textarea th:field="*{about}" class="w-full p-2 border rounded-md" placeholder="Write something here..."></textarea>
                        <p th:if="${#fields.hasErrors('about')}" th:errors="*{about}" class="text-red-600 text-sm mt-1">
                        </p>
                    </div>


                    <div class="flex justify-center gap-4 mt-6">
                        <button type="submit" class="px-4 py-2 text-white bg-blue-700 rounded-md hover:bg-blue-800">
                            Signup
                        </button>
                        <button type="reset" class="px-4 py-2 text-white bg-orange-500 rounded-md hover:bg-gray-600">
                            Reset
                        </button>
                    </div>
                </form>

            </div>
        </div>
    </div>

    <script>
        console.log("Register page loaded");
    </script>

</body>

</html>
