<!DOCTYPE html>
<html
  lang="en"
  th:replace="~{base :: parent(~{::#content},~{::title},~{::script})}"
>
  <head>
    <title>Update Profile</title>
  </head>

  <body>
    <div id="content">

      <!-- Sidebar -->
      <div th:if="${loggedInUser != null}">
        <div th:replace="~{user/sidebar :: sidebar}"></div>
      </div>

      <!-- Main Content -->
      <div class="pt-20 sm:ml-64 px-6">

        <div class="max-w-2xl mx-auto bg-white dark:bg-gray-800 p-6 rounded-2xl shadow">

          <h2 class="text-2xl font-bold mb-6 text-gray-800 dark:text-white">
            Update Profile
          </h2>

          <!-- FORM -->
          <form th:action="@{/user/update-profile}" method="post" th:object="${user}">

            <!-- Name -->
            <div class="mb-4">
              <label class="block text-gray-600 mb-1">Name</label>
              <input
                type="text"
                th:field="*{name}"
                class="w-full border rounded-lg px-3 py-2"
                placeholder="Enter your name"
              />
            </div>

            <!-- Email (readonly) -->
            <div class="mb-4">
              <label class="block text-gray-600 mb-1">Email</label>
              <input
                type="email"
                th:field="*{email}"
                readonly
                class="w-full border rounded-lg px-3 py-2 bg-gray-100"
              />
            </div>

            <!-- Phone -->
            <div class="mb-4">
              <label class="block text-gray-600 mb-1">Phone</label>
              <input
                type="text"
                th:field="*{phoneNumber}"
                class="w-full border rounded-lg px-3 py-2"
                placeholder="Enter phone number"
              />
            </div>

            <!-- About -->
            <div class="mb-4">
              <label class="block text-gray-600 mb-1">About</label>
              <textarea
                th:field="*{about}"
                rows="4"
                class="w-full border rounded-lg px-3 py-2"
                placeholder="Write something about yourself"
              ></textarea>
            </div>

            <!-- Buttons -->
            <div class="flex gap-4">
              <button
                type="submit"
                class="bg-blue-600 text-white px-5 py-2 rounded-lg hover:bg-blue-700"
              >
                Update Profile
              </button>

              <a
                href="/profile"
                class="bg-gray-500 text-white px-5 py-2 rounded-lg hover:bg-gray-600"
              >
                Cancel
              </a>
            </div>

          </form>

        </div>
      </div>

    </div>

    <!-- Scripts -->
    <script th:src="@{'/js/admin.js'}"></script>
    <script>
      console.log("Update profile page loaded");
    </script>

  </body>
</html>
