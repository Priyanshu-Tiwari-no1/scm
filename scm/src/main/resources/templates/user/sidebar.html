<aside
  data-th-fragment="sidebar"
  id="logo-sidebar"
  class="fixed top-16 left-0 z-40 w-64 h-[calc(100vh-4rem)]
         transition-transform -translate-x-full sm:translate-x-0
         bg-white border-r border-gray-200
         dark:bg-gray-900 dark:border-gray-700 shadow-lg"
  aria-label="Sidebar"
> 
  <div class="h-full px-4 py-6 overflow-y-auto bg-gray-50 dark:bg-gray-900">

    <!-- Profile -->
    <div class="flex flex-col items-center text-center mb-8">

      <img th:src="@{/images/pic.png}" class="h-20 w-20 rounded-full shadow-md" alt="Logo" />

      <h2 class="mt-3 text-lg font-semibold text-gray-800 dark:text-white"
          data-th-text="${loggedInUser != null ? loggedInUser.name : 'User'}">
      </h2>

      <p class="text-sm text-gray-500 dark:text-gray-600">
        Welcome back 
      </p>
    </div>

    <div class="border-t border-gray-200 dark:border-gray-700 mb-4"></div>

    <!-- Menu -->
    <ul class="space-y-2 font-medium">

      <li>
        <a data-th-href="@{'/user/dashboard'}"
           class="flex items-center gap-3 p-3 rounded-xl
                  text-gray-700 dark:text-gray-300
                  hover:bg-blue-100 dark:hover:bg-gray-700
                  hover:text-blue-600 dark:hover:text-white transition">
          <i class="fa-solid fa-chart-line"></i>
          Dashboard
        </a>
      </li>

      <li>
        <a data-th-href="@{'/user/profile'}"
           class="flex items-center gap-3 p-3 rounded-xl
                  text-gray-700 dark:text-gray-300
                  hover:bg-blue-100 dark:hover:bg-gray-700
                  hover:text-blue-600 dark:hover:text-white transition">
          <i class="fa-solid fa-user"></i>
          Profile
        </a>
      </li>

      <li>
        <a data-th-href="@{'/user/contacts/addcontact'}"
           class="flex items-center gap-3 p-3 rounded-xl
                  text-gray-700 dark:text-gray-300
                  hover:bg-blue-100 dark:hover:bg-gray-700
                  hover:text-blue-600 dark:hover:text-white transition">
          <i class="fa-solid fa-user-plus"></i>
          Add Contact
        </a>
      </li>

      <li>
        <a data-th-href="@{'/user/contacts'}"
           class="flex items-center gap-3 p-3 rounded-xl
                  text-gray-700 dark:text-gray-300
                  hover:bg-blue-100 dark:hover:bg-gray-700
                  hover:text-blue-600 dark:hover:text-white transition">
          <i class="fa-solid fa-address-book"></i>
          Contacts
        </a>
      </li>

      <div class="border-t border-gray-200 dark:border-gray-700 my-3"></div>

      <li>
        <a th:href="@{/do-logout}"
           class="flex items-center gap-3 p-3 rounded-xl
                  text-red-600 hover:bg-red-100
                  dark:hover:bg-red-700 dark:hover:text-white transition">
          <i class="fa-solid fa-right-from-bracket"></i>
          Logout
        </a>
      </li>

    </ul>
  </div>
</aside>
